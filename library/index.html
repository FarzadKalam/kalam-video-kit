<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نمونه‌ها و تکنیک‌های کلام</title><style>
@font-face{font-family:Peyda;src:url('../assets/fonts/Peyda-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#f4f6ef;color:#14251c;font-family:Peyda,sans-serif;padding:30px;line-height:1.8}main{max-width:1150px;margin:auto}h1{font-size:30px}input,select{font:inherit;border:1px solid #879a8c;padding:12px;border-radius:12px;background:white;max-width:100%;margin:4px}input{width:440px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px;margin-top:25px}article{padding:24px;background:white;border:1px solid #cbd6cd;border-radius:20px}article img{width:100%;height:230px;object-fit:contain;background:#e9eee9;border-radius:12px}h2{font-size:23px}small{color:#42634e}a{color:#116039}code{direction:ltr;display:block;text-align:left;overflow-wrap:anywhere;font-size:13px}.badge{background:#e4f4e9;padding:4px 12px;border-radius:20px;font-size:14px}</style>
<main><h1>کتابخانهٔ ایده و تکنیک</h1><p>نمونه، راهنمای فنی و دستور طراحی از هم مشخص‌اند. مدل ابزار و کد را می‌بیند؛ انتخاب نهایی از محتوای هر سفارش است. <a href="fonts.html">مشاهدهٔ فونت‌ها</a></p><input id="q" aria-label="جست‌وجو" placeholder="موضوع یا تکنیک: چهره، نمودار، تبلیغ…"><select id="engine" aria-label="موتور"><option value="">همهٔ موتورها</option><option>hyperframes</option><option>remotion</option><option>either</option></select><div id="cards" class="grid"></div></main>
<script src="catalog-data.js"></script><script>
const types={'local-authored':'نمونهٔ کد قابل اجرا','workflow-recipe':'دستور طراحی؛ نیازمند فایل پروژه','bundled-upstream-guide':'راهنمای رسمی بسته‌بندی‌شده','registry-reference':'مرجع رجیستری'};
function render(){const q=document.querySelector('#q').value.toLowerCase(),engine=document.querySelector('#engine').value;const box=document.querySelector('#cards');box.replaceChildren();for(const item of window.KALAM_CATALOG.filter(x=>(!engine||x.engine===engine)&&[x.name,x.description,...x.tags,...x.techniques].join(' ').toLowerCase().includes(q))){const article=document.createElement('article');if(item.preview){const img=document.createElement('img');img.src=item.preview;img.alt=item.name;article.append(img)}const badge=document.createElement('span');badge.className='badge';badge.textContent=item.engine+' · '+(types[item.sourceType]||item.sourceType);const h=document.createElement('h2');h.textContent=item.name;const p=document.createElement('p');p.textContent=item.description;const code=document.createElement('code');code.textContent=item.techniques.join(' · ');const a=document.createElement('a');a.textContent='کد یا راهنمای ساخت';a.href=item.code?'../'+item.code:item.source;article.append(badge,h,p,code,a);box.append(article)}}document.querySelector('#q').oninput=render;document.querySelector('#engine').onchange=render;render();
</script></html>
