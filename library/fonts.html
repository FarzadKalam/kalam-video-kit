<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فونت‌های کیت تدوین کلام</title><link rel="stylesheet" href="../assets/fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;padding:35px;background:#f4f6ef;color:#14251c;font-family:Peyda;line-height:1.8}main{max-width:1180px;margin:auto}article{padding:28px;background:white;border:1px solid #c9d5cc;border-radius:20px;margin:20px 0}.sample{font-size:46px;line-height:1.9;overflow-wrap:anywhere}.sample.small{font-size:28px}h2{font:700 28px Peyda}small{font:400 18px Peyda;color:#42634e}label,select,input{font:400 20px Peyda}input[type=text]{width:100%;padding:15px;border:1px solid #9bae9e;border-radius:12px}.weights{display:flex;flex-wrap:wrap;gap:18px}.pending{opacity:.65}a{color:#116039}</style>
<main><h1>فونت واقعی، وزن واقعی</h1><p>کلام تازه با پیدا؛ کلام شهر با دوران پس از دریافت فایل درست. بقیهٔ خانواده‌ها بیشتر برای تبلیغات‌اند. میم به درخواست مالک غیرفعال است.</p><input id="text" type="text" value="از خبر تا حرکت؛ روایت تازه برای شما ۱۲۳۴۵۶۷۸۹۰" aria-label="متن آزمایشی"><p><a href="index.html">کتابخانهٔ ایده‌ها</a></p><div id="families"></div></main>
<script src="fonts-data.js"></script><script>
const root=document.querySelector('#families');
function paint(){root.replaceChildren();for(const f of window.KALAM_FONTS){const card=document.createElement('article');if(f.status!=='available')card.className='pending';const h=document.createElement('h2');h.textContent=(f.nameFa||f.family)+' · '+f.family;const desc=document.createElement('p');desc.textContent=f.guidance||'';card.append(h,desc);if(f.status==='available'){const box=document.createElement('div');box.className='weights';const primary=f.files.filter(x=>!x.cssFamily);const hasVariable=primary.find(x=>x.weightRange);for(const w of (hasVariable?[400,700,900]:[...new Set(primary.map(x=>x.weight))])){const sample=document.createElement('div');const label=document.createElement('small');label.textContent='وزن '+w;const text=document.createElement('div');text.className='sample';text.style.fontFamily=f.family;text.style.fontWeight=w;text.textContent=document.querySelector('#text').value;sample.append(label,text);box.append(sample)}card.append(box);const small=document.createElement('div');small.className='sample small';small.style.fontFamily=f.family;small.textContent='متن ریز برای بررسی خوانایی: امروز روایت شما را با تصویر و حرکت همراه می‌کنیم.';card.append(small);for(const item of primary.filter(x=>x.axes&&x.axes.some(a=>a.tag!=='wght'))){const note=document.createElement('small');note.textContent='محورهای واقعی: '+item.axes.map(a=>a.tag+' '+a.min+'–'+a.max).join('، ');card.append(note)}}root.append(card)}}document.querySelector('#text').oninput=paint;paint();
</script></html>
